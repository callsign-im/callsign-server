# Production stack for the single host. deploy.sh writes .env next to this file.
name: callsign

x-app: &app
  image: ${IMAGE:?set by deploy.sh}
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    shm_size: 128m
    volumes:
      - /var/lib/callsign/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, "${PGUSER}", -d, "${PGDATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    restart: "no"
    profiles: [migrate]
    command: [node, src/migrate.ts]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: [node, src/worker.ts]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/callsign/caddy:/data
    depends_on:
      - api
